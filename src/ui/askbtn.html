<!doctype html>
<html><head><meta charset="utf-8"><title>Ask Magpie</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { background: transparent; overflow: hidden; user-select: none; }
  body { padding: 4px; }
  button {
    all: unset; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; height: 32px;
    border-radius: 16px; cursor: pointer; font: 600 13px var(--font); color: #fff; letter-spacing: -.005em;
    background: linear-gradient(180deg, #2b8cff, #007aff); box-shadow: inset 0 1px 0 rgba(255,255,255,.28);
    animation: pop .16s cubic-bezier(.2,.8,.2,1);
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.97); }
  @keyframes pop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
</style></head>
<body><button id="b"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20C4 10 10 4 20 4c0 10-6 16-16 16z"/><path d="M4 20l9-9"/></svg>Ask Magpie</button>
<script>
document.getElementById('b').addEventListener('mousedown', (e) => { e.preventDefault(); magpie.send('askbtn:click'); });
</script></body></html>
